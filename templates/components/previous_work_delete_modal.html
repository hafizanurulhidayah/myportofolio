<p class="previous-work-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-previous-work-{{ previous_work.id }}"
            aria-label="Hapus {{ previous_work.title }}"
            title="Hapus previous work">
        Hapus
    </button>
</p>

<div id="delete-previous-work-{{ previous_work.id }}"
     class="previous-work-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-previous-work-title-{{ previous_work.id }}">

    <button type="button"
            class="previous-work-delete-modal__backdrop"
            popovertarget="delete-previous-work-{{ previous_work.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus">
    </button>

    <div class="previous-work-delete-modal__content">

        <button type="button"
                class="previous-work-delete-modal__close"
                popovertarget="delete-previous-work-{{ previous_work.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">
            ×
        </button>

        <h2 id="delete-previous-work-title-{{ previous_work.id }}">
            Hapus Previous Work?
        </h2>

        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ previous_work.title }}</strong>?
        </p>

        <div class="previous-work-delete-modal__actions">

            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-previous-work-{{ previous_work.id }}"
                    popovertargetaction="hide">
                Batal
            </button>

            <form method="post"
            action="{% url 'main:delete_previous_work' previous_work.id %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="secret-{{ previous_work.id }}">
                    Security Code
                </label>

                <input
                    type="password"
                    id="secret-{{ previous_work.id }}"
                    name="secret"
                    placeholder="Masukkan security code"
                    required
                >
            </div>

            <button type="submit"
                    class="button button-danger">
                Ya, Hapus
            </button>
        </form>

        </div>
    </div>
</div>
