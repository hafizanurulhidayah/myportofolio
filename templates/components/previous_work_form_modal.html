<div id="add-previous-work-modal"
     class="previous-work-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-previous-work-modal-title">

    <button type="button"
            class="previous-work-form-modal__backdrop"
            popovertarget="add-previous-work-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah previous work">
    </button>

    <div class="previous-work-form-modal__content">

        <button type="button"
                class="previous-work-form-modal__close"
                popovertarget="add-previous-work-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah previous work">
            ×
        </button>

        <h2 id="add-previous-work-modal-title">
            Tambah Previous Work Baru
        </h2>

        <form id="previous-work-form"
              method="post"
              action="{% url 'main:create_previous_work' %}"
              class="previous-work-form"
              enctype="multipart/form-data">

            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">

                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <p class="form-error">
                            {{ error }}
                        </p>
                    {% endfor %}

                </div>
            {% endfor %}

            <div class="previous-work-form-modal__actions">

                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-previous-work-modal"
                        popovertargetaction="hide">
                    Batal
                </button>

                <button type="submit"
                        class="button">
                    Tambah Previous Work
                </button>

            </div>

        </form>
    </div>
</div>
