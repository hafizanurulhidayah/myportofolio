<form method="post"
      action="{% url 'main:toggle_star_previouswork' previouswork.id %}"
      class="star-form">

    {% csrf_token %}

    <button type="submit"
            class="button button-star{% if user in previouswork.starred_by.all %} is-starred{% endif %}"
            title="{% if user in previouswork.starred_by.all %}Unstar{% else %}Jadilah yang pertama memberi star{% endif %}">

        <span aria-hidden="true">★</span>

        {% if user in previouswork.starred_by.all %}
            Unstar
        {% else %}
            Star
        {% endif %}

        <span class="star-count">
            {{ previouswork.starred_by.count }}
        </span>

    </button>
</form>
