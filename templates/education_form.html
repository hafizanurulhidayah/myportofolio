{% extends "base.html" %}

{% block meta %}
    <title>Add Education - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="experience-section">
        <div class="container">

            <h1>Add New Education</h1>

            <form method="post"
                  action="{% url 'main:create_education' %}"
                  class="education-form">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="button">
                    Tambah Education
                </button>

                <a href="{% url 'main:show_education' %}"
                   class="button button-secondary">
                    Batal
                </a>

            </form>

        </div>
    </section>
</main>
{% endblock content %}
