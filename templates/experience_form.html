{% extends "base.html" %}

{% block meta %} <title>{{ page_title }} - {{ name }}</title>
{% endblock meta %}

{% block content %} 
<main> 
    <section class="experience-section">
        <div class="container"> 
            <h1>{{ page_title }}</h1>
            <form method="post"
            {% if page_title == "Edit Experience" %}
                action="{% url 'main:update_experience' experience.id %}"
            {% else %}
                action="{% url 'main:create_experience' %}"
            {% endif %}
            class="education-form"
            enctype="multipart/form-data">

                {% csrf_token %}

                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% for error in field.errors %}
                            <p class="form-error">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}

                <button type="submit" class="button">
                    {{ button_text }}
                </button>

                <a href="{% url 'main:show_experience' %}"
                   class="button button-secondary">
                    Batal
                </a>
            </form>
        </div>
    </section>
</main>
```

{% endblock content %}
